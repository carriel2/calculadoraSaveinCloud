apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-saveincloud
  namespace: laboratorio
  labels:
    app: calculadora-saveincloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculadora-saveincloud
  template:
    metadata:
      labels:
        app: calculadora-saveincloud
    spec:
      containers:
      - name: frontend
        image: ghcr.io/carriel2/calculadorasaveincloud:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
